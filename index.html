<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the UI language before first paint to avoid a flash of the wrong locale.
      try {
        var params = new URLSearchParams(window.location.search)
        var saved = window.localStorage.getItem('lang')
        var fromUrl = params.get('lang')
        if (fromUrl === 'en' || fromUrl === 'es') {
          document.documentElement.lang = fromUrl
        } else if (saved === 'en' || saved === 'es') {
          document.documentElement.lang = saved
        } else {
          var preferred = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language]
          var match = preferred
            .map(function (tag) { return tag.toLowerCase() })
            .filter(function (tag) {
              return tag.indexOf('es') === 0 || tag.indexOf('en') === 0
            })[0]
          document.documentElement.lang = match && match.indexOf('en') === 0 ? 'en' : 'es'
        }
      } catch (e) {
        // Keep the default lang attribute
      }
    </script>
